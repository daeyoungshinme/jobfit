{% macro resume_fields(values) %}
{% set v = values or {} %}
<div class="card form-card">
  <h3>상세 내용</h3>
  <label>경력/경험
    <textarea name="career" rows="5" placeholder="회사, 기간, 담당 업무와 성과를 적어주세요">{{ v.career or '' }}</textarea>
  </label>
  <label>프로젝트
    <textarea name="projects" rows="5" placeholder="프로젝트명, 역할, 사용 기술, 성과를 적어주세요">{{ v.projects or '' }}</textarea>
  </label>
  <label>학력
    <textarea name="education" rows="3" placeholder="학교, 전공, 졸업연도">{{ v.education or '' }}</textarea>
  </label>
  <label>보유 기술 스킬 (쉼표로 구분)
    <input type="text" name="skills_text" placeholder="예: Python, FastAPI, PostgreSQL, Docker" value="{{ v.skills_text or '' }}">
  </label>
</div>
{% endmacro %}
