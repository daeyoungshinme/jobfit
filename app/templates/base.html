<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}JobFit{% endblock %}</title>
  <script>
    (function () {
      const saved = localStorage.getItem("theme");
      const theme = saved || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      document.documentElement.setAttribute("data-theme", theme);
    })();
  </script>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <a href="#main-content" class="skip-link">본문으로 건너뛰기</a>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="/jobs">JobFit</a>
      <nav>
        <div class="nav-group">
          <span class="nav-group-label">공고</span>
          <a href="/jobs/new" {% if request.url.path == "/jobs/new" %}aria-current="page"{% endif %}>등록</a>
          <a href="/jobs" {% if request.url.path == "/jobs" or (request.url.path.startswith("/jobs/") and request.url.path != "/jobs/new") %}aria-current="page"{% endif %}>목록</a>
        </div>
        <div class="nav-group">
          <span class="nav-group-label">이력서</span>
          <a href="/resumes/new" {% if request.url.path == "/resumes/new" %}aria-current="page"{% endif %}>등록</a>
          <a href="/resumes" {% if request.url.path == "/resumes" or (request.url.path.startswith("/resumes/") and request.url.path != "/resumes/new") %}aria-current="page"{% endif %}>목록</a>
        </div>
        <div class="nav-group">
          <span class="nav-group-label">분석</span>
          <a href="/analysis/dashboard" {% if request.url.path in ("/analysis/dashboard", "/analysis/coach") %}aria-current="page"{% endif %}>대시보드</a>
          <a href="/analysis/skills" {% if request.url.path == "/analysis/skills" %}aria-current="page"{% endif %}>스킬 통계</a>
        </div>
      </nav>
      <button id="theme-toggle" class="theme-toggle" type="button" aria-label="테마 전환">🌙</button>
    </div>
  </header>
  {% set flash = flash_messages.get(request.query_params.get("msg")) if flash_messages else None %}
  {% if flash %}<div id="toast" class="toast toast-{{ flash[1] }}" role="{{ 'alert' if flash[1] == 'error' else 'status' }}">{{ flash[0] }}</div>{% endif %}
  <main class="container" id="main-content">
    {% block content %}{% endblock %}
  </main>
  <script src="/static/app.js"></script>
</body>
</html>
