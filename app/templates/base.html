<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}JobFit{% endblock %}</title>
  <script>
    (function () {
      const saved = localStorage.getItem("theme");
      const theme = saved || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      document.documentElement.setAttribute("data-theme", theme);
      document.documentElement.classList.add("js");
    })();
  </script>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <a href="#main-content" class="skip-link">본문으로 건너뛰기</a>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="/jobs">JobFit</a>
      {% set nav_active = nav_active_for(request.url.path) %}
      <nav class="primary-nav">
        <a href="/jobs" class="nav-link" {% if nav_active == "jobs" %}aria-current="page"{% endif %}>
          <span class="nav-icon" aria-hidden="true">📋</span><span class="nav-label">공고</span>
        </a>
        <a href="/resumes" class="nav-link" {% if nav_active == "resumes" %}aria-current="page"{% endif %}>
          <span class="nav-icon" aria-hidden="true">📄</span><span class="nav-label">이력서</span>
        </a>
        <a href="/analysis/dashboard" class="nav-link" {% if nav_active == "analysis" %}aria-current="page"{% endif %}>
          <span class="nav-icon" aria-hidden="true">🎯</span><span class="nav-label">매칭·편집</span>
        </a>
        <a href="/analysis/activity" class="nav-link" {% if nav_active == "activity" %}aria-current="page"{% endif %}>
          <span class="nav-icon" aria-hidden="true">📊</span><span class="nav-label">활동</span>
        </a>
      </nav>
      <button id="theme-toggle" class="theme-toggle" type="button" aria-label="테마 전환">🌙</button>
    </div>
  </header>
  {% set flash = flash_messages.get(request.query_params.get("msg")) if flash_messages else None %}
  {% if flash %}<div id="toast" class="toast toast-{{ flash[1] }}" role="{{ 'alert' if flash[1] == 'error' else 'status' }}">{{ flash[0] }}</div>{% endif %}
  <main class="container" id="main-content">
    {% block content %}{% endblock %}
  </main>
  <script src="/static/app.js"></script>
</body>
</html>
